name: Countersign
# Builds the evidence pack for an agent-written PR, posts it as a sticky comment, sets the `countersign/tier` status
# and routes the PR to the owner named in the signed mandate.
#
# pull_request_target, not pull_request: the workflow, the mandate, the owners' public keys and the login map all come
# from the protected default branch, so a PR cannot rewrite the rules it is judged by. PR code is never executed; its
# commits are only read as git objects (diff stats, quoted lines).
#
# Runs on GitHub-hosted runners until the repo variable CI_RUNNER is `craci` (same pattern as the team's other repo).
# CRACI reads cracicorp/setup's inputs when it schedules the job and ignores the step's `if:`.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to (re)evaluate"
        required: true

concurrency:
  group: countersign-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read   # checkout and fetch only; everything posted to the PR goes through the Countersign Gate app token

jobs:
  pack:
    name: countersign (evidence pack, tier, owner)
    environment: countersign-gate   # holds COUNTERSIGN_APP_KEY; deployment branches: main only
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        if: ${{ vars.CI_RUNNER == 'craci' }}
        with:
          size: "2"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fetch the PR's commits (as data) and the ledger branch
        run: |
          git fetch -q origin "+refs/pull/${PR}/head:refs/remotes/pr/${PR}" countersign-ledger
          git worktree add -q --detach /tmp/ledger origin/countersign-ledger
      - name: Install Countersign's two dependencies
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pyyaml==6.0.3 cryptography==50.0.2
      - name: Mint the Countersign Gate app token (posts status, comment, labels, routing)
        id: gate
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.COUNTERSIGN_APP_ID }}
          private-key: ${{ secrets.COUNTERSIGN_APP_KEY }}
      - name: Build the pack, comment, status, route to owner
        env:
          PYTHONPATH: .countersign/snapshot
          GITHUB_TOKEN: ${{ steps.gate.outputs.token }}   # read by countersign.github for every API call
        run: /tmp/venv/bin/python -m countersign.github check --pr "$PR" --ledger-dir /tmp/ledger --artifacts /tmp/packs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-pack-pr-${{ env.PR }}
          path: /tmp/packs
          if-no-files-found: ignore
