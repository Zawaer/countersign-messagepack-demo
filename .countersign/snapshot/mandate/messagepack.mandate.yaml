# Countersign review mandate for MessagePack-CSharp.
# This file is policy, not code: it says what the AI reviewer may clear alone and what goes to a named human.
# It is signed by its owner (messagepack.mandate.yaml.sig) and its sha256 is recorded in every evidence pack.
# Any edit invalidates the signature; until the owner re-signs, nothing clears below `ask`.

id: messagepack-csharp
version: 6
owner: Toivo
repo: https://github.com/te-industry-tech-office/junction26-messagepack-csharp

# Confidentiality. confidential: true means only reviewers marked self_hostable (open weights we can run on
# our own hardware) may read the code; the others are skipped and the pack says so. An area may override this
# with its own `confidential:`. MessagePack-CSharp is open source, so nothing here is confidential.
confidential: false

# Reviewer registry. role: reviewer = gives per-clause verdicts and findings; every participating reviewer must
# say `met` with verified evidence for a clause to be proven. role: adjudicator = reads only the disputed items
# (with both sides' cited evidence and the engine's verification) when reviewers disagree; it can add reasons
# and route to a human, never clear anything.
# model + prompt_version are the reviewer versions this signed mandate trusts at the area caps (trust.release_gate):
# a review by any other version holds every area at `ask` until that version passes the seeded-defect set.
reviewers:
  claude:   {vendor: Anthropic, model: claude-opus-5-5, prompt_version: review-v1, role: reviewer, self_hostable: false}
  codex:    {vendor: OpenAI, model: GPT-6, prompt_version: review-v1, role: reviewer, self_hostable: false}
  nemotron: {vendor: NVIDIA, model: nvidia/nemotron-3.5-super-vl-120b-a12b, prompt_version: review-v1, role: reviewer, self_hostable: true,
             note: "open weights; called on NVIDIA's hosted API here, a confidential repo must point it at a self-hosted endpoint"}
  gemini:   {vendor: Google, model: gemini-4-hydrogen, role: adjudicator, self_hostable: false}

# Areas: first match wins, so order is precedence. max_ai_tier is the most lenient tier the AI may
# assign alone in that area (its clearance right). The trust ledger can lower it after an escape.
# v5 (red team G1, G3): build inputs and CI come first. A props/targets file reaches into every project below it
# (a one-line Compile Include put a tests/ file into MessagePack.dll), and a workflow runs with the repo's secrets,
# so they are not judged by the folder they sit in: src/Directory.Build.props and
# src/MessagePack.SourceGenerator/Directory.Build.props are build-config, not tests or the generator. Both caps are
# ask, so this precedence can only make a file stricter.
areas:
  build-config:
    description: MSBuild and SDK inputs that change what every project below them compiles, restores or runs
    owner: Rene
    paths: ["**/Directory.Build.*", "**/Directory.Packages.props", "**/*.props", "**/*.targets", "**/global.json",
            "**/nuget.config", "**/NuGet.config", "**/NuGet.Config", ".config/**"]
    sensitivity: high
    max_ai_tier: ask
    checks: [build]
  ci:
    description: CI workflows; they run with the repository's secrets and publish packages
    owner: Toivo
    paths: [".github/**", "azure-pipelines/**", "azure-pipelines.yml"]
    sensitivity: high
    max_ai_tier: ask
    checks: []
  runtime-core:
    description: Serializer runtime; deserializes untrusted input
    owner: Toivo
    paths: ["src/MessagePack/**"]
    sensitivity: critical
    max_ai_tier: ask
    checks: [build, tests.targeted, tests.full_suite]
  annotations-api:
    description: Public attributes every user compiles against
    owner: Toivo
    paths: ["src/MessagePack.Annotations/**"]
    sensitivity: critical
    max_ai_tier: ask
    checks: [build]
  generator-analyzer-core:
    description: Roslyn source generator and MsgPack00x analyzers
    owner: Toivo
    paths: ["src/MessagePack.SourceGenerator/**", "src/MessagePack.Analyzers*/**"]
    sensitivity: high
    max_ai_tier: notify
    # tests.full_suite added in v3: 4 seeded defects were caught only by the full suite (measurement/results.json)
    checks: [build, tests.targeted, tests.fail_without_fix, tests.full_suite]
  build:
    description: Project files and the solution (build inputs that reach beyond one project are build-config)
    owner: Rene
    paths: ["**/*.csproj", "*.sln"]
    sensitivity: medium
    max_ai_tier: notify
    checks: [build]
  docs:
    description: User documentation and analyzer docs
    owner: Rene
    paths: ["doc/**", "**/*.md"]
    sensitivity: low
    max_ai_tier: silent
    checks: []
  # v5 (security-downgrade benchmark): weakening a security test (MessagePackSecurityTests.cs) cleared at silent in
  # tests. Tests that pin security behaviour come before `tests` and go to the owner.
  security-tests:
    description: Tests that pin security behaviour (untrusted-data limits, unsafe code)
    owner: Toivo
    paths: ["tests/**/*Security*", "tests/**/*Security*/**", "tests/**/*Unsafe*", "tests/**/*Unsafe*/**"]
    sensitivity: high
    max_ai_tier: ask
    checks: [build, tests.targeted]
  tests:
    description: Test projects, test resources, samples, benchmarks
    owner: Toivo
    paths: ["tests/**", "sandbox/**", "benchmark/**"]
    sensitivity: low
    max_ai_tier: silent
    checks: [build]
  unmapped:
    description: Anything no other area claims
    owner: Toivo
    paths: []
    sensitivity: medium
    max_ai_tier: ask
    checks: [build]
default_area: unmapped

# Paths where a mistake is a security problem (deserialization of untrusted data, unsafe code).
security_sensitive_paths:
  - "src/MessagePack/MessagePackSecurity.cs"
  - "src/MessagePack/MessagePackReader*.cs"
  - "src/MessagePack/Formatters/**"
  - "src/MessagePack/Internal/**"
  - "**/*Unsafe*.cs"
  - "tests/**/*Security*"           # v5: security tests (weakening one is a security downgrade)
  - "tests/**/*Security*/**"
  - "tests/**/*Unsafe*"

# Deterministic checks each requirement clause needs, by clause type.
# A clause may add its own with `checks:` in requirements/<change>.yaml.
requirement_checks:
  functional: [build, tests.targeted]
  non-functional: [build]
  docs: [docs.anchors]            # documentation clauses: a docs-only change has no build or tests to run
  intent: []

decision:
  # Proven needs EVERY participating reviewer (registry role reviewer, allowed by confidentiality) to say met
  # with verified evidence, and the clause's checks to pass. A reviewer that did not run counts as missing_review.
  reviewers_required: all_participating
  min_verified_evidence: 1        # per reviewer verdict; fewer -> thin_evidence
  code_line_tolerance: 3          # a code quote may sit up to N lines from the cited line
  # Code evidence must cite head or base in a file the change touches; base may also cite these context files.
  # Only substantive items count: code quotes, tests with a claimed outcome, checks with a claimed status (R7).
  base_context_files: []
  refused_clause_tier: ask        # any clause the AI could not prove
  # A reviewer refusal routes `ask` if it names a clause (`req`), is marked `blocking: true`, or its topic names a
  # mandated check or one of refusal_ask_terms. Any other refusal is out of scope: shown, in residual risk, and
  # it routes out_of_scope_refusal_tier, so the owner is still told (never silent).
  reviewer_refusal_tier: ask
  out_of_scope_refusal_tier: notify
  refusal_ask_terms: [security, untrusted, unsafe, deserializ, public api, breaking, binary compat, runtime, crash, data loss]
  held_before_tier: notify        # a clause met, but already met before the change: not achieved by it
  finding_tiers: {blocker: ask, major: ask, minor: notify, info: silent}
  blocker_confirmed_tier: block   # blocker verified by both reviewers, or backed by a failing check

# Supply chain (v4). deps.delta (stage 1) diffs the restored NuGet graph of base and head. A package name or version
# the change adds or moves goes to a human unless it is listed here (a name allows any version, name@version only
# that one; case-insensitive). deps.delta is deliberately not an area check: a dependency change goes to the owner
# as a supply-chain question (rule dependency-change), it is not a failed mandated check.
supply_chain:
  allowed_new_dependencies: []

# Hard rules. `when` names a predicate in countersign/decide.py (RULES); `value` is its threshold.
rules:
  - {id: split-large-change, when: files_changed_gt, value: 50, tier: block,
     message: "More than 50 files changed: split the change so each part can be reviewed"}
  - {id: generated-files, when: generated_files_gt, value: 10, tier: ask,
     message: "More than 10 generated files: a human confirms the regeneration is intended"}
  # public_api is a detector, not a pass/fail gate: status fail or changed: true means the public surface changed.
  - {id: public-api-change, when: public_api_changed, tier: ask,
     message: "Public API changed: the owner decides on compatibility"}
  - {id: source-without-tests, when: source_without_tests, tier: ask,
     message: "Source changed with no test change"}
  - {id: mandated-check-failed, when: mandated_check_failed, tier: block,
     message: "A check this area mandates failed"}
  - {id: mandated-check-missing, when: mandated_check_missing, tier: ask,
     message: "A check this area mandates did not run (skipped, errored or absent)"}
  - {id: mandate-not-signed, when: mandate_unsigned, tier: ask,
     message: "The mandate is not validly signed by its owner, so the AI has no clearance rights"}
  # injection_scan (stage 1) fails when the diff or commit message holds text addressed to automated reviewers.
  # The reviewers read it, so the engine also marks their verdicts untrusted: no clause can be proven.
  - {id: R-INJECT, when: injection_found, tier: block,
     message: "Text addressed to automated reviewers found in the change: reviewers saw planted instructions, their verdicts don't count"}
  # Supply chain (v4), from the build: what no code reviewer reads. Each only makes routing stricter.
  - {id: dependency-change, when: deps_unallowed, tier: ask,
     message: "The change adds or moves a package (or feed) the mandate does not allow: the owner reviews the supply chain"}
  - {id: new-advisory, when: deps_new_vulnerability, tier: block,
     message: "The change brings in a package version with a known advisory not on base"}
  - {id: build-egress-violation, when: egress_violation, tier: block,
     message: "The build tried to reach a host outside its network policy"}
  # v5 (red team S2, S3, S7): deps.delta at fail/error, or a new/changed dotnet tool, MSBuild SDK or SDK pin
  # (build-time code that is not in the restored package graph).
  - {id: dependency-check-failed, when: deps_check_failed, tier: ask,
     message: "deps.delta failed or errored, or the change adds or changes a dotnet tool, MSBuild SDK or SDK pin: the owner reviews the supply chain"}
  # v5 (red team I9): binary files the scanner could not read: a human looks; nothing planted was found, so not R-INJECT.
  - {id: injection-unscannable, when: injection_unscannable, tier: ask,
     message: "The change adds content the injection scan cannot read (binary files): a human looks at it"}
  # v5 (red team G2): a file named like generated output whose input did not change is a hand edit nobody regenerated.
  - {id: generated-file-hand-edited, when: generated_hand_edited, tier: ask,
     message: "A generated-looking file (*.g.cs or a T4 template's output) changed without its input: a human reviews the hand edit"}

# Risk score: additive, every point has a printed reason. Bands map to tiers.
risk:
  sensitivity_points: {low: 0, medium: 10, high: 20, critical: 35}
  # v6 (red team G4): size grows smoothly, no cliff. points = min(cap, knee * ln(1 + per * size / knee)): about `per`
  # per unit for a small change, bending logarithmically for a large one. 49 one-line test files now score 43.1 (ask),
  # close to 51; v5's linear rate capped at 20 scored 49 files like 20. The >50-files split rule is unchanged.
  files: {per: 1.1, knee: 80, cap: 45}
  lines: {per: 4, knee: 100, cap: 20}  # size = non-generated lines added + removed, per 100 (per as in v5)
  size_cap: 45                         # files_changed + lines_changed together (v5: 40): size alone never blocks
  per_generated_file: 0.1
  generated_cap: 10
  public_api_change: 20
  source_without_tests: 15
  security_sensitive_path: 25
  fail_without_fix_not_shown: 15
  per_reviewer_disagreement: 8
  per_failed_check: 25
  thresholds: {notify: 15, ask: 40, block: 130}   # score >= threshold -> that tier; blocks normally come from hard rules

# Trust stages per area: ask -> notify -> silent, never above the area's max_ai_tier (where each area starts).
# Drop one stage (and start probation) on: an escape on an AI-cleared change, a disagreeing spot-check, or a
# canary run where the panel missed a seeded defect. Climb one stage when the next stage's row holds:
#   agreeing_spotchecks  in a row since the last drop or climb
#   min_agreement        share of agreeing spot-checks over the last agreement_window spot-checks
#   no_escapes_in_last   changes (signoffs + spot-checks) in the area since the last escape
# v3 (from the measurement, docs/MEASUREMENT.md): 3 agreeing spot-checks restored clearance within days while
# reviewers had drifted; 20, plus weekly canaries, brought simulated escapes back to the full-review baseline.
trust:
  stages:
    ask:    {entry: "every area after a drop; every area while a reviewer version is not released"}
    notify: {agreeing_spotchecks: 20, min_agreement: 0.95, agreement_window: 40, no_escapes_in_last: 50}
    silent: {agreeing_spotchecks: 40, min_agreement: 0.98, agreement_window: 80, no_escapes_in_last: 100}
  # Canaries: seeded defects (evidence/*-mut*) sent through the reviewer panel every week per area, recorded with
  # `countersign canary`. Any miss drops a stage. A run that catches at least min_catch_rate of the set also
  # releases the reviewer versions it ran with (a new model or prompt_version restarts at ask until then).
  # v5 (red team L2): a run releases only if it lists every id in seeded_set (a "1 of 1" run releases nothing).
  canaries: {per_week_per_area: 2}
  release_gate:
    min_catch_rate: 1.0
    seeded_set: [2129-mut1, 2129-mut2, 2234-mut1, 2234-mut2, 2234-mut3, 2234-mut4, 2234-mut5, 2234-mut6, 2234-mut7,
                 2283-mut1, 2283-mut2, 2283-mut3, 2283-mut4, 2283-mut5]
  # v5 (red team L3): a spot-check counts only if its signer owns the area, and once per pack (pack_sha256).
  # Anything else is ignored, and `countersign trust` says why.
  spotchecks: {signer: area_owner, count_once_per: pack_sha256}

# Never checked by this pipeline; printed in every pack under "not checked".
known_gaps:
  - {id: other-targets, reason: "Tests run on net8.0 only; .NET Framework, Unity and NativeAOT targets are not exercised"}
  - {id: runtime-perf, reason: "No benchmarks unless a perf-sensitive path is touched; allocation and throughput regressions can slip through"}
  - {id: semantic-intent, reason: "Correctness beyond what tests and cited evidence show is not established by the AI"}
  - {id: provenance, reason: "Licensing and provenance of agent-written code are not checked"}

# Inputs to the review-time estimate. Estimates are always reported as simulated.
measurement:
  full_read_lines_per_minute: 12
  generated_lines_per_minute: 120
  full_read_minutes_per_file: 1
  pack_minutes: {silent: 0, notify: 1, ask: 5, block: 3}
  minutes_per_refused_item: 3
  minutes_per_verified_finding: 2
